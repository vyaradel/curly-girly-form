<style>
/* Layout: one question per screen; brand header (wavy-ring icon), solid progress, big rounded question, answer cards, bottom nav */
:root{
  --bg:#F8F5F6; --surface:#FFFFFF; --blush:#FFE4EF; --ring:#F4A3C3; --fg:#331423; --muted:#7A5566; --line:#EADBE2;
  --accent:#D70A5B; --accent-text:#A40134; --on-accent:#FFFFFF; --echo:#331423; --ill:#D70A5B;
  --brand:"Fredoka","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1F0C16; --surface:#2B1220; --blush:#3A1829; --ring:#F4A3C3; --fg:#F8F5F6; --muted:#CBA7B8; --line:#4A2236;
  --accent:#D70A5B; --accent-text:#F7A6C6; --on-accent:#FFFFFF; --echo:#F4A3C3; --ill:#F2679C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1F0C16; --surface:#2B1220; --blush:#3A1829; --ring:#F4A3C3; --fg:#F8F5F6; --muted:#CBA7B8; --line:#4A2236;
  --accent:#D70A5B; --accent-text:#F7A6C6; --on-accent:#FFFFFF; --echo:#F4A3C3; --ill:#F2679C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
.wrap{max-width:600px;margin:0 auto;padding-block:24px 128px;display:flex;flex-direction:column;gap:26px;position:relative;z-index:1}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* brand marks */
.ring{fill:var(--blush);stroke:var(--ring);stroke-linejoin:round}
.cg-fill{fill:var(--accent)} .cg-echo{fill:none;stroke:var(--echo);stroke-width:3}
.curl{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.logo{width:min(340px,82%);height:auto;display:block}
.logo .wm{font-family:"Fredoka",sans-serif;font-weight:700;font-size:132px;letter-spacing:2px}
.logo .tag{font-family:"Fredoka",sans-serif;font-weight:500;font-size:24px;letter-spacing:10px;fill:var(--fg)}
.icon{width:46px;height:46px;flex:none}
.logo.hlogo{width:min(150px,42vw)}
.icon .ring{stroke-width:22}
.icon text{font-family:"Fredoka",sans-serif;font-weight:700;font-size:190px;letter-spacing:-4px}
.mk{width:18px;height:18px;flex:none}
.mk .ring{stroke-width:60}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .name{display:flex;align-items:center;gap:10px;font-family:var(--brand);font-weight:700;font-size:18px;color:var(--accent)}
.count{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--blush);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .35s ease}

.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
h1,h2{margin:0;font-family:var(--body);font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(30px,7.4vw,44px);line-height:1.1}
h2{font-size:clamp(22px,5.4vw,28px);line-height:1.25}
.hint{margin:0;color:var(--muted);max-width:54ch}
.q{display:flex;flex-direction:column;gap:14px}

.opts{display:flex;flex-wrap:wrap;gap:10px}
.opts.stack{flex-direction:column}
.opt{font:inherit;font-weight:700;font-size:15.5px;text-align:left;color:var(--fg);background:var(--surface);
  border:2px solid var(--line);border-radius:18px;padding:13px 18px;cursor:pointer;
  transition:background .15s,border-color .15s,transform .1s}
.opt small{display:block;font-weight:600;font-size:13.5px;color:var(--muted);margin-top:1px}
.opt:hover{border-color:var(--ring);background:var(--blush)}
.opt:active{transform:scale(.985)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt[aria-pressed="true"] small{color:var(--on-accent);opacity:.88}
.opt:focus-visible,.btn:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
/* illustrated answers */
.opts.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.opts.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.opt.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:16px 10px 14px}
.opt.tile.wide{grid-column:1/-1;flex-direction:row;justify-content:center;padding:12px 16px}
.opt.has-ic{display:flex;align-items:center;gap:14px;padding-block:10px}
.opt .txt{min-width:0}
.ill,.ic{color:var(--ill);fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ill{width:84px;height:84px;stroke-width:3}
.ic{width:40px;height:40px;stroke-width:2.4}
.opt.tile.wide .ic{width:32px;height:32px}
.ill .bgc{fill:currentColor;fill-opacity:.09;stroke:none}
.ic .fl{fill:currentColor;fill-opacity:.14}
.ic .dot{fill:currentColor;stroke:none}
.ic .soft{opacity:.4}
.opt[aria-pressed="true"] .ill,.opt[aria-pressed="true"] .ic{color:var(--on-accent)}
.opt[aria-pressed="true"] .ill .bgc{fill-opacity:.16}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale .opt{text-align:center;font-family:var(--brand);font-size:22px;padding:15px 0}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;font-weight:600;color:var(--muted)}
textarea,input[type=text]{width:100%;font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
textarea{min-height:130px;resize:vertical}
.note{font-size:13.5px;font-weight:600;color:var(--accent-text);min-height:1.2em}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.consent input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.fine{margin:0;padding-left:30px;font-size:13px;line-height:1.5;color:var(--muted);max-width:60ch}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:600px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{font:inherit;font-weight:800;font-size:15.5px;border:0;border-radius:999px;padding:14px 26px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);padding-inline:6px}

/* intro */
.intro{gap:22px;padding-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chips li{font-size:13.5px;font-weight:700;color:var(--fg);background:var(--blush);border:1.5px solid var(--ring);border-radius:999px;padding:6px 13px}
.deco{position:absolute;right:-110px;bottom:-60px;width:220px;height:220px;opacity:.35;pointer-events:none;z-index:-1}
.deco .ring{stroke-width:14}

.summary{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 18px;font-size:14px;white-space:pre-wrap;max-height:320px;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toast{font-size:14px;font-weight:700;color:var(--accent-text)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function answered(q){
  if (q.consent && A[q.id]) return !!A[q.id + "_ok"];
  if (q.opt) return true;
  const v = A[q.id];
  return Array.isArray(v) ? v.length > 0 : v != null && v !== "";
}

function intro(){
  nav.hidden = true;
  app.innerHTML = `
    <div class="q intro">
      ${LOGO}
      <div class="eyebrow">${MK}Проучване</div>
      <h1>Разкажи ни за косата си</h1>
      <p class="hint">CurlyGirly е посветен на натуралната грижа за къдрава и естествена коса. Искаме да разберем какво си пробвала досега, кое не е проработило и от какво имаш нужда. Анкетата е анонимна, освен ако сама не решиш да оставиш контакт в края.</p>
      <ul class="chips"><li>около 6 минути</li><li>без регистрация</li><li>безплатен план за желаещи</li></ul>
      <div><button class="btn primary" id="start" type="button">Започвам →</button></div>
    </div>
    <svg class="deco" viewBox="240 -10 520 520" aria-hidden="true"><use href="#ringPath" class="ring"/></svg>`;
  document.getElementById("start").onclick = () => go(0);
}

function render(){
  const L = vis(), q = L[i]; nav.hidden = false;
  let body = "";
  if (q.t === "single" || q.t === "multi"){
    const tiles = q.layout === "tiles";
    body = `<div class="opts ${tiles ? "tiles" : (q.stack ? "stack" : "")}" role="group" aria-label="${esc(q.q)}">` + q.o.map(o => {
      const l = lab(o), sub = Array.isArray(o) && o[1] ? `<small>${esc(o[1])}</small>` : "";
      const key = Array.isArray(o) ? o[2] : null;
      const on = q.t === "single" ? A[q.id] === l : (A[q.id] || []).includes(l);
      let pic = "", cls = "opt";
      if (key && HAIR[key]) { pic = `<svg class="ill" viewBox="0 0 80 80" aria-hidden="true">${HAIR[key]}</svg>`; cls += " tile"; }
      else if (key && ICO[key]) { pic = `<svg class="ic" viewBox="0 0 48 48" aria-hidden="true">${ICO[key]}</svg>`; cls += tiles ? " tile wide" : " has-ic"; }
      return `<button class="${cls}" type="button" aria-pressed="${on}" data-v="${esc(l)}">${pic}<span class="txt">${esc(l)}${sub}</span></button>`;
    }).join("") + `</div>`;
  } else if (q.t === "scale"){
    body = `<div class="scale" role="group" aria-label="${esc(q.q)}">` + [1,2,3,4,5].map(n =>
      `<button class="opt" type="button" aria-pressed="${A[q.id] === n}" data-v="${n}">${n}</button>`).join("") +
      `</div><div class="ends"><span>1 · ${esc(q.lo)}</span><span>5 · ${esc(q.hi)}</span></div>`;
  } else if (q.t === "text"){
    body = `<textarea id="f-${q.id}" maxlength="800" placeholder="${esc(q.ph||"")}">${esc(A[q.id]||"")}</textarea>`;
  } else {
    body = `<input type="text" id="f-${q.id}" maxlength="120" placeholder="${esc(q.ph||"")}" value="${esc(A[q.id]||"")}">` +
      (q.consent ? `<label class="consent" for="c-${q.id}"><input type="checkbox" id="c-${q.id}" ${A[q.id + "_ok"] ? "checked" : ""}><span>${esc(q.consent)}</span></label>` : "") +
      (q.privacy ? `<p class="fine">${esc(q.privacy)}</p>` : "");
  }
  app.innerHTML = `
    <div class="top"><div class="name">${ICON}${HLOGO}</div><div class="count">${i+1} / ${L.length}</div></div>
    <div class="bar" aria-hidden="true"><i style="width:${Math.round(i / L.length * 100)}%"></i></div>
    <div class="q">
      <div class="eyebrow">${MK}${esc(q.s)}</div>
      <h2>${esc(q.q)}</h2>
      ${q.h ? `<p class="hint">${esc(q.h)}</p>` : ""}
      ${body}
      ${q.max ? `<div class="note" id="lim" role="status"></div>` : ""}
    </div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(q, b.dataset.v));
  const f = document.getElementById("f-" + q.id);
  if (f) f.oninput = () => { A[q.id] = f.value.trim(); setNext(q); };
  const c = document.getElementById("c-" + q.id);
  if (c) c.onchange = () => { A[q.id + "_ok"] = c.checked; setNext(q); };
  setNext(q);
}

function setNext(q){
  const L = vis(), last = i === L.length - 1;
  nextB.disabled = !answered(q);
  nextB.textContent = last ? "Готово" : (q.opt && !A[q.id] ? "Пропусни" : "Напред");
}

function pick(q, v){
  if (q.t === "scale") v = +v;
  if (q.t === "single" || q.t === "scale"){
    A[q.id] = v; render();
    setTimeout(() => { if (vis()[i] === q) go(i + 1); }, 260);
    return;
  }
  let arr = A[q.id] || [];
  if (arr.includes(v)) arr = arr.filter(x => x !== v);
  else if (q.none && v === q.none) arr = [v];
  else {
    arr = arr.filter(x => x !== q.none);
    if (q.max && arr.length >= q.max){
      const n = document.getElementById("lim");
      if (n) n.textContent = `Можеш да избереш до ${q.max}. Махни един, за да добавиш друг.`;
      return;
    }
    arr.push(v);
  }
  A[q.id] = arr; render();
}

function go(n){
  i = n;
  if (i < 0) return intro();
  if (i >= vis().length) return done();
  render(); window.scrollTo({top:0});
}
nextB.onclick = () => { if (!nextB.disabled) go(i + 1); };
backB.onclick = () => go(i - 1);

let sent = false;
const HEAD = () => `
    <div class="top"><div class="name">${ICON}${HLOGO}</div><div class="count">Готово</div></div>
    <div class="bar" aria-hidden="true"><i style="width:100%"></i></div>`;

function done(){
  nav.hidden = true;
  if (sent) return thanks();
  const rows = vis().map(q => {
    const v = A[q.id];
    return {k: q.k, v: Array.isArray(v) ? v.join(", ") : (v == null ? "" : String(v))};
  });
  const cq = Q.find(q => q.consent);
  if (cq && A[cq.id] && vis().includes(cq)) rows.push({k: "Съгласие за контакт", v: A[cq.id + "_ok"] ? "Да" : "Не"});
  const txt = "CurlyGirly · проучване\n\n" + rows.map(r => `${r.k}: ${r.v || "—"}`).join("\n");
  if (!SHEET_URL) return manual(txt, false);

  app.innerHTML = HEAD() + `
    <div class="q">
      <div class="eyebrow">${MK}Последна стъпка</div>
      <h1>Изпращаме…</h1>
      <p class="hint">Само секунда.</p>
    </div>`;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
  fetch(SHEET_URL, {method: "POST", body: JSON.stringify({answers: rows}), signal: ctl.signal})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { if (!j || !j.ok) throw j; sent = true; thanks(); })
    .catch(() => manual(txt, true))
    .finally(() => clearTimeout(timer));
}

function thanks(){
  const talk = A.contact && A.contact_ok && vis().some(q => q.id === "contact");
  app.innerHTML = HEAD() + `
    <div class="q">
      <div class="eyebrow">${MK}Готово</div>
      <h1>Благодарим ти!</h1>
      <p class="hint">Отговорите ти са записани.${talk ? (String(A.talk).startsWith("Искам платена") ? " Ще ти пишем с цената на консултацията." : " Ще се свържем с теб за разговора.") : ""}</p>
    </div>`;
}

function manual(txt, failed){
  app.innerHTML = HEAD() + `
    <div class="q">
      <div class="eyebrow">${MK}Последна стъпка</div>
      <h1>${failed ? "Почти готово" : "Благодарим ти!"}</h1>
      <p class="hint">${failed ? "Не успяхме да изпратим отговорите ти автоматично. Копирай ги и ги изпрати в лично съобщение на авторката на поста." : "За да стигнат отговорите ти до нас, копирай ги и ги изпрати в лично съобщение на авторката на поста. Така остават само между нас."}</p>
      <div class="row">
        <button class="btn primary" id="copy" type="button">Копирай отговорите</button>
        <button class="btn ghost" id="edit" type="button">← Промени отговор</button>
      </div>
      <span class="toast" id="toast" role="status"></span>
      <div class="summary" id="sum" tabindex="0">${esc(txt)}</div>
    </div>`;
  document.getElementById("edit").onclick = () => go(vis().length - 1);
  document.getElementById("copy").onclick = async () => {
    const t = document.getElementById("toast");
    try { await navigator.clipboard.writeText(txt); t.textContent = "Копирано. Сега го изпрати в лично съобщение."; }
    catch(e){
      const r = document.createRange(); r.selectNodeContents(document.getElementById("sum"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      t.textContent = "Текстът е маркиран. Копирай го и го изпрати.";
    }
  };
}

intro();

/* Snow: brand-colored flakes that drift down, slide away from the pointer and scatter on tap */
(() => {
  const cv = document.getElementById("snow"), g = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ptr = {x:0, y:0, on:false};
  let W = 0, H = 0, dpr = 1, flakes = [], spr = [], raf = 0, last = 0;

  const tok = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  function sprite(color, fancy){
    const s = 64, c = document.createElement("canvas"); c.width = c.height = s;
    const x = c.getContext("2d"); x.translate(s/2, s/2);
    x.strokeStyle = color; x.fillStyle = color; x.lineCap = "round"; x.lineWidth = fancy ? 3.2 : 3.8;
    for (let k = 0; k < 6; k++){
      x.save(); x.rotate(k * Math.PI / 3); x.beginPath();
      x.moveTo(0, 0); x.lineTo(0, -27);
      if (fancy){ x.moveTo(0,-12); x.lineTo(-7,-19); x.moveTo(0,-12); x.lineTo(7,-19); x.moveTo(0,-21); x.lineTo(-4,-25); x.moveTo(0,-21); x.lineTo(4,-25); }
      x.stroke(); x.restore();
    }
    if (!fancy){ x.beginPath(); x.arc(0, 0, 4.5, 0, 7); x.fill(); }
    return c;
  }
  function paint(){ const r = tok("--ring"), a = tok("--accent"); spr = [sprite(r,true), sprite(r,false), sprite(a,true), sprite(a,false)]; }

  function reset(f, top){
    f.x = Math.random() * W;
    f.y = top ? -30 - Math.random() * 60 : Math.random() * H;
    f.r = 4 + Math.random() ** 2 * 11;
    f.fall = 12 + f.r * 2.4 + Math.random() * 8;
    f.ph = Math.random() * 6.28; f.sw = 6 + Math.random() * 14;
    f.rot = Math.random() * 6.28; f.vr = (Math.random() - .5) * .7;
    f.s = Math.random() < .72 ? (Math.random() < .5 ? 0 : 1) : (Math.random() < .5 ? 2 : 3);
    f.a = .28 + Math.random() * .4; f.vx = 0; f.vy = 0;
    return f;
  }
  function size(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const n = Math.round(Math.min(70, Math.max(26, W * H / 15000)));
    while (flakes.length < n) flakes.push(reset({}, false));
    flakes.length = n;
    if (reduce) draw();
  }
  function push(x, y, R, power){
    for (const f of flakes){
      const dx = f.x - x, dy = f.y - y, d = Math.hypot(dx, dy) || 1;
      if (d < R){ const k = (1 - d / R) * power; f.vx += dx / d * k; f.vy += dy / d * k; }
    }
  }
  function step(dt){
    if (ptr.on) push(ptr.x, ptr.y, 100, 1100 * dt);
    const damp = Math.pow(.05, dt);
    for (const f of flakes){
      f.ph += dt * .9; f.rot += f.vr * dt;
      f.vx *= damp; f.vy *= damp;
      f.x += f.vx * dt; f.y += (f.fall + f.vy) * dt;
      if (f.y > H + 30) reset(f, true);
      if (f.x < -30) f.x += W + 60; else if (f.x > W + 30) f.x -= W + 60;
    }
  }
  function draw(){
    g.setTransform(1,0,0,1,0,0); g.clearRect(0, 0, cv.width, cv.height);
    for (const f of flakes){
      const x = f.x + Math.sin(f.ph) * f.sw, c = Math.cos(f.rot) * dpr, s = Math.sin(f.rot) * dpr;
      g.globalAlpha = f.a;
      g.setTransform(c, s, -s, c, x * dpr, f.y * dpr);
      g.drawImage(spr[f.s], -f.r, -f.r, f.r * 2, f.r * 2);
    }
    g.globalAlpha = 1;
  }
  function loop(t){
    const dt = last ? Math.min(.05, (t - last) / 1000) : .016; last = t;
    step(dt); draw(); raf = requestAnimationFrame(loop);
  }
  function start(){ if (!reduce && !raf){ last = 0; raf = requestAnimationFrame(loop); } }
  function stop(){ cancelAnimationFrame(raf); raf = 0; }

  addEventListener("pointermove", e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; }, {passive:true});
  addEventListener("pointerdown", e => { ptr.x = e.clientX; ptr.y = e.clientY; push(e.clientX, e.clientY, 150, 260); }, {passive:true});
  addEventListener("pointerup", e => { if (e.pointerType !== "mouse") ptr.on = false; }, {passive:true});
  document.addEventListener("pointerleave", () => { ptr.on = false; });
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
  addEventListener("resize", size);
  const repaint = () => { paint(); if (reduce) draw(); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", repaint);
  new MutationObserver(repaint).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

  paint(); size(); start();
})();
</script>

</html>
